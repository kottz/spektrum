[package]
name = "spektrum_test"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = "0.3.32"
serde_json = "1.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
reqwest = { version = "0.13.3", features = ["json"] }
rand = "0.10.1"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
