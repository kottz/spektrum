[package]
name = "spektrum"
version = "0.3.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "http2", "multipart"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
thiserror = "2.0.21"
http = "1.5.0"
config = "0.15.27"
bytes = "1.12.1"
chrono = "0.4.45"
flate2 = "1.1.11"
aws-sdk-s3 = "1.159.0"
dashmap = "6.2.1"
arc-swap = "1.9.5"
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
